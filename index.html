<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Luminary 2048</title>
    <!-- Pre-define tailwind config to avoid ReferenceError if CDN loads asynchronously or fails -->
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        background-color: #faf8ef;
        margin: 0;
        padding: 0;
      }

      /* Custom pop animation for new tiles */
      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Merge bounce animation */
      @keyframes mergeBounce {
        0% { transform: scale(1); }
        50% { transform: scale(1.22); }
        100% { transform: scale(1); }
      }
      .animate-merge {
        animation: mergeBounce 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Custom scrollbar for modals */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(150, 150, 150, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(150, 150, 150, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator shown before React bundle mounts -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #faf8ef; color: #776e65; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <h1 style="font-size: 52px; font-weight: 900; margin: 0 0 16px 0; color: #776e65; letter-spacing: -1px;">2048</h1>
        <div style="width: 36px; height: 36px; border: 4px solid rgba(119, 110, 101, 0.2); border-top-color: #8f7a66; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 600; opacity: 0.75;">正在载入游戏...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Production static bundle auto-loader for GitHub Pages / static hosting -->
    <script>
      (function() {
        var isStaticDeploy = !window.__vite_plugin_react_preamble_installed__ && (
          window.location.hostname.endsWith('github.io') ||
          window.location.hostname.includes('github') ||
          window.location.protocol === 'file:' ||
          (window.location.port !== '3000' && window.location.port !== '5173')
        );

        if (isStaticDeploy) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          s.onerror = function() {
            var s2 = document.createElement('script');
            s2.type = 'module';
            s2.crossOrigin = 'anonymous';
            s2.src = './docs/assets/index.js';
            s2.onerror = function() {
              var targetDocsUrl = window.location.pathname.replace(/\/+$/, '') + '/docs/';
              if (!window.location.pathname.endsWith('/docs/') && !window.location.pathname.endsWith('/docs/index.html')) {
                window.location.replace(targetDocsUrl);
              }
            };
            document.head.appendChild(s2);
          };
          document.head.appendChild(s);
        }
      })();
    </script>

    <!-- Source entry point for Vite dev server & Vite build -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
