<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Luminary 2048</title>
    <!-- Pre-define tailwind config to avoid ReferenceError if CDN loads asynchronously or fails -->
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        background-color: #faf8ef;
        margin: 0;
        padding: 0;
      }

      /* Allow smooth touch scrolling on modals and scrollable elements */
      .overflow-y-auto, .overflow-y-scroll, [data-scrollable="true"] {
        touch-action: pan-y !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior-y: contain !important;
      }

      /* Optimized hardware-accelerated animations */
      .will-change-transform {
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* Elastic spring pop animation for newly spawned tiles */
      @keyframes popIn {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        55% {
          transform: scale(1.14);
          opacity: 1;
        }
        80% {
          transform: scale(0.96);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Merge impact bounce synchronized with tile arrival (~120ms) */
      @keyframes mergeBounce {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.02);
        }
        60% {
          transform: scale(1.22);
        }
        82% {
          transform: scale(0.96);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-merge {
        animation: mergeBounce 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
      }

      /* Floating score gain animation */
      @keyframes scoreFloat {
        0% {
          transform: translate3d(0, 0, 0) scale(0.75);
          opacity: 0;
        }
        20% {
          transform: translate3d(0, -6px, 0) scale(1.18);
          opacity: 1;
        }
        65% {
          transform: translate3d(0, -22px, 0) scale(1.02);
          opacity: 0.95;
        }
        100% {
          transform: translate3d(0, -36px, 0) scale(0.92);
          opacity: 0;
        }
      }
      .animate-score-float {
        animation: scoreFloat 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        pointer-events: none;
      }

      /* Tactile bump for score card */
      @keyframes scoreBump {
        0% { transform: scale(1); }
        40% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }
      .animate-score-bump {
        animation: scoreBump 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Dynamic theme-adaptive radiant pulse for 1024, 2048, and milestone tiles */
      @keyframes tileGlowSubtle {
        0%, 100% {
          box-shadow: 0 0 0 1.5px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.5),
                      0 0 12px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.35),
                      0 4px 10px rgba(0, 0, 0, 0.14);
        }
        50% {
          box-shadow: 0 0 0 2px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.8),
                      0 0 20px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.65),
                      0 5px 14px rgba(0, 0, 0, 0.18);
        }
      }
      .animate-tile-glow-subtle {
        animation: tileGlowSubtle 2.4s ease-in-out infinite;
      }

      @keyframes tileGlow {
        0%, 100% {
          box-shadow: 0 0 0 2px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.65),
                      0 0 16px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.5),
                      0 4px 12px rgba(0, 0, 0, 0.16);
        }
        50% {
          box-shadow: 0 0 0 2.5px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.95),
                      0 0 30px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.85),
                      0 6px 18px rgba(0, 0, 0, 0.24);
        }
      }
      .animate-tile-glow {
        animation: tileGlow 2.2s ease-in-out infinite;
      }

      @keyframes tileSuperGlow {
        0%, 100% {
          box-shadow: 0 0 0 2.5px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.8),
                      0 0 22px rgba(var(--tile-glow-rgb, 245, 158, 11), 0.7),
                      0 0 44px rgba(var(--tile-glow-super-rgb, 168, 85, 247), 0.45),
                      0 5px 14px rgba(0, 0, 0, 0.22);
        }
        50% {
          box-shadow: 0 0 0 3px rgba(var(--tile-glow-rgb, 245, 158, 11), 1),
                      0 0 38px rgba(var(--tile-glow-rgb, 245, 158, 11), 1),
                      0 0 65px rgba(var(--tile-glow-super-rgb, 168, 85, 247), 0.75),
                      0 8px 22px rgba(0, 0, 0, 0.32);
        }
      }
      .animate-tile-super-glow {
        animation: tileSuperGlow 2.0s ease-in-out infinite;
      }

      /* Modal and backdrop entrances */
      @keyframes overlayFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-overlay-in {
        animation: overlayFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes modalSlideUp {
        from {
          opacity: 0;
          transform: translate3d(0, 24px, 0) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }
      .animate-modal-up {
        animation: modalSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Custom scrollbar for modals */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(150, 150, 150, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(150, 150, 150, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator shown before React bundle mounts -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #faf8ef; color: #776e65; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <h1 style="font-size: 52px; font-weight: 900; margin: 0 0 16px 0; color: #776e65; letter-spacing: -1px;">2048</h1>
        <div style="width: 36px; height: 36px; border: 4px solid rgba(119, 110, 101, 0.2); border-top-color: #8f7a66; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 600; opacity: 0.75;">正在载入游戏...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Production static bundle auto-loader for GitHub Pages / static hosting -->
    <script>
      (function() {
        var isStaticDeploy = !window.__vite_plugin_react_preamble_installed__ && (
          window.location.hostname.endsWith('github.io') ||
          window.location.hostname.includes('github') ||
          window.location.protocol === 'file:' ||
          (window.location.port !== '3000' && window.location.port !== '5173')
        );

        if (isStaticDeploy) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          s.onerror = function() {
            var s2 = document.createElement('script');
            s2.type = 'module';
            s2.crossOrigin = 'anonymous';
            s2.src = './docs/assets/index.js';
            s2.onerror = function() {
              var targetDocsUrl = window.location.pathname.replace(/\/+$/, '') + '/docs/';
              if (!window.location.pathname.endsWith('/docs/') && !window.location.pathname.endsWith('/docs/index.html')) {
                window.location.replace(targetDocsUrl);
              }
            };
            document.head.appendChild(s2);
          };
          document.head.appendChild(s);
        }
      })();
    </script>

    <!-- Source entry point for Vite dev server & Vite build -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
