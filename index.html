<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Luminary 2048</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }

      /* Custom pop animation for new tiles */
      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop {
        animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Merge bounce animation */
      @keyframes mergeBounce {
        0% { transform: scale(1); }
        50% { transform: scale(1.22); }
        100% { transform: scale(1); }
      }
      .animate-merge {
        animation: mergeBounce 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Custom scrollbar for modals */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(150, 150, 150, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(150, 150, 150, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
